version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: marketplace_pg_db
    restart: always
    environment:
      POSTGRES_DB: ${PG_NAME:-django_rest_final}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASS:-AbuBabu0703}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: marketplace_api_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PG_HOST=db
      - PG_PORT=5432
      - PG_NAME=${PG_NAME:-django_rest_final}
      - PG_USER=${PG_USER:-postgres}
      - PG_PASS=${PG_PASS:-AbuBabu0703}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-marketplace-final-project-secret-key-12345}
      - DEBUG=True
      - ALLOWED_HOSTS=*
    depends_on:
      - db

volumes:
  pgdata:

